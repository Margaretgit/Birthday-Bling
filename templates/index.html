<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Bliss</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🎂 Birthday Bling</h1>

        <p class="tagline">
            Create a beautiful birthday card in seconds.
        </p>

        <form action="/create" method="POST">

            <label>Celebrant's Name</label>
            <input type="text"
                   name="name"
                   placeholder="Enter name"
                   required>


            <label>Age</label>
            <input type="number"
                   name="age"
                   placeholder="Enter age"
                   required>


            <label>Relationship</label>

            <select name="relationship">

                <option>Friend</option>
                <option>Mother</option>
                <option>Father</option>
                <option>Brother</option>
                <option>Sister</option>
                <option>Teacher</option>
                <option>Classmate</option>

            </select>


            <label>Message Style</label>

            <select name="style">

                <option>Emotional</option>
                <option>Funny</option>
                <option>Inspirational</option>
                <option>Short and Sweet</option>

            </select>


            <label>Personal Message</label>

            <textarea
                name="message"
                placeholder="Write your birthday message..."
                rows="5"
                required></textarea>


            <button type="submit">
                🎁 Create My Birthday Card
            </button>

        </form>

    </div>

</body>

</html>
